    <text x="500" y="337" font-family="Helvetica Neue, Arial, sans-serif" font-size="37" font-weight="400" letter-spacing="17" text-anchor="middle">RUSSIN HOMES</text>
    <text x="500" y="383" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="10" text-anchor="middle">CUSTOM HOMES</text>
