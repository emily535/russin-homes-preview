<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" preserveAspectRatio="xMinYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Russin Homes Option A, Refined Pitch</title>
